# Scoped Trivy exceptions. YAML (not plain .trivyignore) is required for
# path scoping; library-ci.yml passes this file with the `trivyignores`
# input, and trivy-action exports it as TRIVY_IGNOREFILE.
misconfigurations:
  # AWS-0089 ("bucket has logging disabled") on the dedicated S3 server
  # access-log DESTINATION buckets. AWS's server access logging guidance
  # explicitly says the destination bucket "should not have server access
  # logging enabled": logging the log bucket would make S3 log its own log
  # deliveries, producing an unbounded loop. The source buckets are covered
  # by aws_s3_bucket_logging; both destinations keep all four public-access
  # block flags and default SSE-S3 encryption (required, because the log
  # delivery account cannot read SSE-KMS objects).
  - id: AVD-AWS-0089
    paths:
      - "modules/aws_s3_bucket/logging.tf"
      - "modules/aws_security_baseline/cloudtrail_logging.tf"
    statement: >-
      Dedicated S3 access-log destination buckets must not themselves enable
      server access logging (AWS guidance: it creates a recursive log loop).
      The source buckets are logged; these destinations are private and
      encrypted.

  # AWS-0132 (HIGH, "use a customer-managed key for S3 encryption") on the
  # dedicated server-access-log destinations. AWS's own guidance for server
  # access logging states that the destination bucket must use SSE-S3: the S3
  # log delivery account cannot read SSE-KMS objects, and "if the destination
  # bucket uses SSE-KMS, Amazon S3 might deliver log objects that are
  # encrypted with a key that you can't access." Trivy's own message repeats
  # this caveat but still raises the finding, so this is a documented false
  # positive for these resources. Both buckets are encrypted with AES256 and
  # stay private (four public-access-block flags).
  - id: AVD-AWS-0132
    paths:
      - "modules/aws_s3_bucket/logging.tf"
      - "modules/aws_security_baseline/cloudtrail_logging.tf"
    statement: >-
      S3 server-access-log destinations must use SSE-S3, not SSE-KMS: the log
      delivery account cannot read SSE-KMS objects (AWS S3 User Guide).
      AES256 encryption is enabled and the buckets are private.
